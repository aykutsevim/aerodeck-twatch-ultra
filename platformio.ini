; AeroDeck: glass-cockpit firmware for LilyGO T-Watch Ultra (primary) and T-Watch S3 (compile-only).
; Constitution VII: every dependency is pinned exactly (no ^/~ ranges, Git URLs pinned to a commit).
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = twatch_ultra
src_dir = src
boards_dir = ./boards

[env_arduino]
framework = arduino
platform = espressif32@6.12.0
upload_speed = 921600
monitor_speed = 115200
board_build.filesystem = fatfs
board_build.partitions = partitions/aerodeck_16MB.csv
extra_scripts =
    pre:tools/fw_version.py
    post:tools/patch_lilygolib.py
build_unflags =
    -std=gnu++11
build_flags =
    -std=gnu++17
    -D CORE_DEBUG_LEVEL=0
    -D RADIOLIB_EXCLUDE_RF69
    -D RADIOLIB_EXCLUDE_SX1231
    -D RADIOLIB_EXCLUDE_RFM2X
    -D RADIOLIB_EXCLUDE_SX127X
    -D RADIOLIB_EXCLUDE_AFSK
    -D RADIOLIB_EXCLUDE_AX25
    -D RADIOLIB_EXCLUDE_HELLSCHREIBER
    -D RADIOLIB_EXCLUDE_MORSE
    -D RADIOLIB_EXCLUDE_RTTY
    -D RADIOLIB_EXCLUDE_SSTV
    -D RADIOLIB_EXCLUDE_DIRECT_RECEIVE
    -D RADIOLIB_EXCLUDE_APRS
    -D RADIOLIB_EXCLUDE_BELL
    -Wnarrowing
    -D ARDUINO_LILYGO_LORA_SX1262
monitor_filters =
    default
    esp32_exception_decoder
lib_deps =
    xinyuan-lilygo/LilyGoLib @ 0.2.0
    lvgl/lvgl @ 9.6.0
    jgromes/RadioLib @ 7.8.1
    lewisxhe/XPowersLib @ 0.3.3
    lewisxhe/SensorLib @ 0.3.4
    mikalhart/TinyGPSPlus @ 1.1.0
    earlephilhower/ESP8266Audio @ 2.0.0
    h2zero/NimBLE-Arduino @ 2.5.2
    https://github.com/lewisxhe/ESP32-BLE-Keyboard-fork.git#20c8b9f1f3e01742c16110a6753ac95ee2b1c0ba
    https://github.com/lewisxhe/ESP32-BLE-Mouse-fork.git#61bcd326fff51efda7f20593fbf0993e72e70ff4
    ; framework-bundled library, versioned by the platform pin
    ESP32 BLE Arduino

[env:twatch_ultra]
extends = env_arduino
board = lilygo-t-watch-ultra
build_flags =
    ${env_arduino.build_flags}
    -I variants/lilygo_twatch_ultra
    -D ARDUINO_T_WATCH_S3_ULTRA
lib_deps =
    ${env_arduino.lib_deps}
    https://github.com/lewisxhe/ST25R3916-fork.git#0c8e00f49d12881d1cff6d6f0879b90ce7ed4033
    https://github.com/lewisxhe/NFC-RFAL-fork.git#7bde4587ea44c36c178a43d083d7a7345c1e4cfe

[env:twatchs3]
extends = env_arduino
board = lilygo-t-watch-s3
build_flags =
    ${env_arduino.build_flags}
    -D ARDUINO_T_WATCH_S3
    -I variants/lilygo_twatch_s3
lib_deps =
    ${env_arduino.lib_deps}
    https://github.com/tonhuisman/IRremoteESP8266.git#e7d6b36a1d4a4caac32c0d32da971c68dcf864e3

; Host-side unit tests for src/core/ (needs MinGW-w64 GCC on PATH on Windows).
[env:native]
platform = native@1.2.1
test_framework = unity
build_flags =
    -std=gnu++17
    -I src
build_src_filter = +<core/>
test_build_src = yes
